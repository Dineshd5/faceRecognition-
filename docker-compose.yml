version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: deepface
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
      - DB_NAME=deepface
      - DB_USER=postgres
      - DB_PASS=password
      - DB_PORT=5432
    depends_on:
      - db

volumes:
  postgres_data:
